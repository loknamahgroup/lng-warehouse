spring.application.name=branchstock-api
server.port=${PORT:8080}

# MongoDB connection comes from the environment (set MONGODB_URI for Atlas / production).
# Without it the app falls back to a local MongoDB instance. Never commit credentials here.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/branchstock}
spring.data.mongodb.database=${MONGODB_DATABASE:branchstock}

# JWT signing key from env in production; the literal below is a dev-only fallback.
app.jwt.secret=${JWT_SECRET:BranchStockLocalDevSecretKeyChangeMe32CharsMin!!}
app.jwt.expiration-ms=28800000

# Behind Render/Docker proxies: use the real client IP (needed by the login rate limiter).
server.forward-headers-strategy=framework

# Initial password for the seeded demo users (only used when the database is empty).
app.seed.password=${SEED_PASSWORD:}

logging.level.org.springframework.security=INFO
