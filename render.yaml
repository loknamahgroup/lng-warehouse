# Render Blueprint (Infrastructure as Code) for BranchStock.
# `runtime: docker` tells Render to build the Dockerfile at the repo root
# (multi-stage: React SPA -> staged into the Spring Boot jar -> runnable image).
# All secrets/credentials are injected via environment variables (never baked in).
services:
  - type: web
    name: branchstock-api
    runtime: docker
    plan: free                  # starter/free tier is enough for a demo; bump as needed
    healthCheckPath: /          # GET / returns the SPA shell (200) before any login
    envVars:
      - key: MONGODB_DATABASE
        value: branchstock
      # ---- The two secrets below are provided through the Render Dashboard ----
      # (Environment -> Add Secret). `sync: false` keeps them out of git; Render
      # prompts for them at sync time and they are never committed.
      - key: MONGODB_URI
        sync: false             # e.g. mongodb+srv://user:pass@cluster0.x.mongodb.net/branchstock
      - key: JWT_SECRET
        sync: false             # strong random string, >= 32 chars
